broker:
  type: postgres
  # All available options and their defaults: ../broker.example.yaml
  postgres:
    host: postgres
    port: 5432
    database: event_store
    # Runtime role; the migrate service overrides the user and password
    # with the migration role through BROKER_POSTGRES_USER/PASSWORD.
    user: event_store_app
    password: event_store_app
    # Container-local example connection; real deployments use verify-full
    # with a CA bundle (ca_cert_file).
    sslmode: disable

subscriber:
  parallelism: 10
